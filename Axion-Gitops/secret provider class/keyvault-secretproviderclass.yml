apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: axion-keyvault-secrets
  namespace: default

spec:
  provider: azure

  parameters: 
    clientID: "0dd26c58-8a3e-40ce-a3f0-01eb2d37a02d"
    keyvaultName: "axion-kv-develop"
    tenantId: "3aaeeb8f-a679-4764-879f-f9839833ec2f"

    objects: |
      array:
        - |
          objectName: postgres-username
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: pgadmin-username
          objectType: secret
        - |
          objectName: pgadmin-password
          objectType: secret

  secretObjects:
    - secretName: axion-postgres-secret
      type: Opaque
      data:
        - objectName: postgres-username
          key: POSTGRES_USER
        - objectName: postgres-password
          key: POSTGRES_PASSWORD

    - secretName: axion-pgadmin-secret
      type: Opaque
      data:
        - objectName: pgadmin-username
          key: PGADMIN_DEFAULT_EMAIL
        - objectName: pgadmin-password
          key: PGADMIN_DEFAULT_PASSWORD