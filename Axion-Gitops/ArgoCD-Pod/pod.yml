
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: default
  labels:
    app: argocd-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-server
  template:
    metadata:
      labels:
        app: argocd-server
    spec:
      containers:
        - name: argocd-server
          image: quay.io/argoproj/argocd:latest
          command:
            - argocd-server
            - --insecure
          ports:
            - containerPort: 8080
              name: http
