################################

# deployment with secrets from keyvault using secret provider class


apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-server

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgresql-server

  template:
    metadata:
      labels:
        app: postgresql-server
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: axion-keyvault-sa

      containers:
        - name: postgresql-server
          image: postgres:17.10

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: axion-postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: axion-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: "postgresdb"

          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: axion-keyvault-secrets
