apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: axion-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/<YOUR_GITHUB_ORG_OR_USERNAME>/axion-gitops.git
    targetRevision: HEAD
    path: helm/axion-app
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # Production often uses manual sync or automated with approval gate
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
