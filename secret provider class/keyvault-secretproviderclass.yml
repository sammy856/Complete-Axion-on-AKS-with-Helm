apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: axion-keyvault-secrets
  namespace: dev

spec:
  provider: azure

  parameters: 
    clientID: "464ac980-6fe4-4683-b10c-8db43119ab0b"
    keyvaultName: "axion-keyvault"
    tenantId: "d6f408de-8aca-4071-9f35-c11c8f36556c"

    objects: |
      array:
        - |
          objectName: postgres-username
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: pgadmin-username
          objectType: secret
        - |
          objectName: pgadmin-password
          objectType: secret

  secretObjects:
    - secretName: axion-postgres-secret
      type: Opaque
      data:
        - objectName: postgres-username
          key: POSTGRES_USER
        - objectName: postgres-password
          key: POSTGRES_PASSWORD

    - secretName: axion-pgadmin-secret
      type: Opaque
      data:
        - objectName: pgadmin-username
          key: PGADMIN_DEFAULT_EMAIL
        - objectName: pgadmin-password
          key: PGADMIN_DEFAULT_PASSWORD