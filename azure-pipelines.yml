trigger: none
pr: none

parameters:
  - name: environment
    displayName: Select Environment
    type: string
    default: dev
    values:
      - dev
      - uat
      - prod

  - name: imageToBuild
    displayName: Select Image to Build
    type: string
    default: axion-ui
    values:
      - axion-ui
      - axion-ingestion-service
      - axion-telemetry-query-service
      - axion-data-simulator
      - all

pool:
  vmImage: ubuntu-latest

# ACR service connections based on environment
variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
      - name: acrServiceConnection
        value: sc-acr-dev
      - name: acrLoginServer
        value: sammyacr.azurecr.io
      - name: helmChartPath
        value: helm/axion-app


  - ${{ if eq(parameters.environment, 'uat') }}:
      - name: acrServiceConnection
        value: sc-acr-uat
      - name: acrLoginServer
        value: YOUR-UAT-ACR.azurecr.io

  - ${{ if eq(parameters.environment, 'prod') }}:
      - name: acrServiceConnection
        value: sc-acr-prod
      - name: acrLoginServer
        value: YOUR-PROD-ACR.azurecr.io

stages:

# =====================================================
# STAGE 1: BUILD, TRIVY SCAN, PUSH 
# =====================================================

  - stage: BuildAndPush
    displayName: Build, Scan, Push and Update GitOps

    jobs:
      - job: DockerBuildPush
        displayName: Build, Scan and Push Selected Images

        steps:

          # Checkout repository
          - checkout: self
            path: app
            persistCredentials: true
            clean: true

          # Install PyYAML
          - bash: |
              python3 -m pip install --user pyyaml
            displayName: Install Python YAML dependency

          # =================================================
          # STEP 1: DOCKER BUILD
          # =================================================

          # Axion UI Build
          - task: Docker@2
            displayName: Build Axion UI
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-ui'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              command: build
              containerRegistry: $(acrServiceConnection)
              repository: axion-ui
              Dockerfile: $(Pipeline.Workspace)/app/Axion App/axion-ui/Dockerfile
              buildContext: $(Pipeline.Workspace)app/Axion App/axion-ui
              tags: |
                $(Build.BuildId)
                ${{ parameters.environment }}-$(Build.BuildId)

          # Ingestion Build
          - task: Docker@2
            displayName: Build Ingestion Service
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-ingestion-service'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              command: build
              containerRegistry: $(acrServiceConnection)
              repository: axion-ingestion-service
              Dockerfile: $(Pipeline.Workspace)/app/Axion App/axion-ingestion-service/Dockerfile
              buildContext: $(Pipeline.Workspace)/app/Axion App/axion-ingestion-service
              tags: |
                $(Build.BuildId)
                ${{ parameters.environment }}-$(Build.BuildId)

          # Telemetry Build
          - task: Docker@2
            displayName: Build Telemetry Query Service
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-telemetry-query-service'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              command: build
              containerRegistry: $(acrServiceConnection)
              repository: axion-telemetry-query-service
              Dockerfile: $(Pipeline.Workspace)/app/Axion App/axion-telemetry-query-service/Dockerfile
              buildContext: $(Pipeline.Workspace)/app/Axion App/axion-telemetry-query-service
              tags: |
                $(Build.BuildId)
                ${{ parameters.environment }}-$(Build.BuildId)

          # Data Simulator Build
          - task: Docker@2
            displayName: Build Data Simulator
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-data-simulator'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              command: build
              containerRegistry: $(acrServiceConnection)
              repository: axion-data-simulator
              Dockerfile: $(Pipeline.Workspace)/app/Axion App/axion-data-simulator/Dockerfile
              buildContext: $(Pipeline.Workspace)/app/Axion App/axion-data-simulator
              tags: |
                $(Build.BuildId)
                ${{ parameters.environment }}-$(Build.BuildId)

          # =================================================
          # STEP 2: TRIVY IMAGE SCANNING
          # =================================================

          # Scan Axion UI
          - task: trivy@2
            displayName: Trivy Scan - Axion UI
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-ui'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              method: install
              version: latest
              type: image
              target: $(acrLoginServer)/axion-ui:$(Build.BuildId)
              scanners: vuln
              severities: HIGH,CRITICAL
              failOnSeverityThreshold: HIGH
              reports: table,html
              publish: true

          # Scan Ingestion Service
          - task: trivy@2
            displayName: Trivy Scan - Ingestion Service
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-ingestion-service'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              method: install
              version: latest
              type: image
              target: $(acrLoginServer)/axion-ingestion-service:$(Build.BuildId)
              scanners: vuln
              severities: HIGH,CRITICAL
              failOnSeverityThreshold: HIGH
              reports: table,html
              publish: true

          # Scan Telemetry Service
          - task: trivy@2
            displayName: Trivy Scan - Telemetry Query Service
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-telemetry-query-service'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              method: install
              version: latest
              type: image
              target: $(acrLoginServer)/axion-telemetry-query-service:$(Build.BuildId)
              scanners: vuln
              severities: HIGH,CRITICAL
              failOnSeverityThreshold: HIGH
              reports: table,html
              publish: true

          # Scan Data Simulator
          - task: trivy@2
            displayName: Trivy Scan - Data Simulator
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-data-simulator'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              method: install
              version: latest
              type: image
              target: $(acrLoginServer)/axion-data-simulator:$(Build.BuildId)
              scanners: vuln
              severities: HIGH,CRITICAL
              failOnSeverityThreshold: HIGH
              reports: table,html
              publish: true

          # =================================================
          # STEP 3: PUSH IMAGES TO ACR
          # =================================================

          # Push Axion UI
          - task: Docker@2
            displayName: Push Axion UI to ACR
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-ui'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              command: push
              containerRegistry: $(acrServiceConnection)
              repository: axion-ui
              tags: |
                $(Build.BuildId)
                ${{ parameters.environment }}-$(Build.BuildId)

          # Push Ingestion
          - task: Docker@2
            displayName: Push Ingestion Service to ACR
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-ingestion-service'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              command: push
              containerRegistry: $(acrServiceConnection)
              repository: axion-ingestion-service
              tags: |
                $(Build.BuildId)
                ${{ parameters.environment }}-$(Build.BuildId)

          # Push Telemetry
          - task: Docker@2
            displayName: Push Telemetry Query Service to ACR
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-telemetry-query-service'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              command: push
              containerRegistry: $(acrServiceConnection)
              repository: axion-telemetry-query-service
              tags: |
                $(Build.BuildId)
                ${{ parameters.environment }}-$(Build.BuildId)

          # Push Data Simulator
          - task: Docker@2
            displayName: Push Data Simulator to ACR
            condition: or(eq('${{ parameters.imageToBuild }}', 'axion-data-simulator'), eq('${{ parameters.imageToBuild }}', 'all'))
            inputs:
              command: push
              containerRegistry: $(acrServiceConnection)
              repository: axion-data-simulator
              tags: |
                $(Build.BuildId)
                ${{ parameters.environment }}-$(Build.BuildId)


  - stage: deploytodev
    displayName: Deploy to Dev
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
    - deployment: DeployJob
      displayName: Deploy with Helm to AKS to dev
      environment: 'Dev-aks'
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
              persistCredentials: true
            - task: HelmInstaller@1
              displayName: Install Helm on Agent
              inputs:
                helmVersionToInstall: '3.11.0'

            - task: HelmDeploy@0
              displayName: Helm Upgrade/Install (Dev)
              inputs:
                connectionType: 'Kubernetes Service Connection'
                kubernetesServiceConnection: 'aksserviceconnection'
                namespace: 'dev'
                command: 'upgrade'
                chartType: 'FilePath'
                chartPath: '$(System.DefaultWorkingDirectory)/$(helmChartPath)'
                releaseName: 'axionui-dev-release'
                overrideValues: 'image.tag=$(Build.BuildId)'
                arguments: '--install --create-namespace -f $(System.DefaultWorkingDirectory)/$(helmChartPath)/values-dev.yaml'

  - stage: DeployToQA
    displayName: Deploy to QA
    dependsOn: deploytodev
    condition: succeeded()
    jobs:
    - deployment: DeployQAJob
      displayName: Deploy with Helm to AKS
      environment: 'QA-aks'
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self
              persistCredentials: true
            - task: HelmInstaller@1
              displayName: Install Helm on Agent
              inputs:
                helmVersionToInstall: '3.11.0'

            - task: HelmDeploy@0
              displayName: Helm Upgrade/Install (QA)
              inputs:
                connectionType: 'Kubernetes Service Connection'
                kubernetesServiceConnection: 'aksserviceconnection'
                namespace: 'qa'
                command: 'upgrade'
                chartType: 'FilePath'
                chartPath: '$(System.DefaultWorkingDirectory)/$(helmChartPath)'
                releaseName: 'axion-qa-release'
                overrideValues: 'image.tag=$(Build.BuildId)'
                arguments: '--install --create-namespace -f $(System.DefaultWorkingDirectory)/$(helmChartPath)/values-qa.yaml'






