{{- if and .Values.keyvault.enabled .Values.keyvault.secretProviderClass.create }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.keyvault.secretProviderClass.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.keyvault.secretProviderClass.provider | default "azure" }}
  parameters:
    clientID: {{ .Values.keyvault.secretProviderClass.clientID | default .Values.global.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyvault.secretProviderClass.keyvaultName | default .Values.global.azure.keyvaultName | quote }}
    tenantId: {{ .Values.keyvault.secretProviderClass.tenantId | default .Values.global.azure.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyvault.secretProviderClass.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: {{ .objectType | default "secret" }}
        {{- end }}
  secretObjects:
    - secretName: axion-postgres-secret
      type: Opaque
      data:
        - objectName: postgres-username
          key: POSTGRES_USER
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
    - secretName: axion-pgadmin-secret
      type: Opaque
      data:
        - objectName: pgadmin-username
          key: PGADMIN_DEFAULT_EMAIL
        - objectName: pgadmin-password
          key: PGADMIN_DEFAULT_PASSWORD
{{- end }}
