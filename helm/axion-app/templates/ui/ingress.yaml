{{- if and .Values.ui.enabled .Values.ui.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "axion.fullname" . }}-ui-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axion.ui.labels" . | nindent 4 }}
  {{- with .Values.ui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ui.ingress.className }}
  ingressClassName: {{ .Values.ui.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ui.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ui.ingress.path | default "/" }}
            pathType: {{ .Values.ui.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "axion.fullname" . }}-ui
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
