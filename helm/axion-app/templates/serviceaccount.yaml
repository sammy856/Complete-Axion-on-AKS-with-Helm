{{- if and .Values.keyvault.enabled .Values.keyvault.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "axion.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.global.azure.workloadIdentityClientId | quote }}
    {{- with .Values.keyvault.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
