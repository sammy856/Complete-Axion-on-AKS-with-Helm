{{- if .Values.telemetry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axion.fullname" . }}-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axion.telemetry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.telemetry.service.type }}
  ports:
    - port: {{ .Values.telemetry.service.port }}
      targetPort: {{ .Values.telemetry.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "axion.telemetry.selectorLabels" . | nindent 4 }}
{{- end }}
