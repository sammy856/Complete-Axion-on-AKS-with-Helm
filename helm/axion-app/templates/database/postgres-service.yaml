{{- if and .Values.database.inCluster.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axion.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axion.postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.database.inCluster.postgres.port }}
      targetPort: {{ .Values.database.inCluster.postgres.port }}
      protocol: TCP
      name: postgresql
  selector:
    {{- include "axion.postgres.selectorLabels" . | nindent 4 }}
{{- end }}
