{{- if and .Values.keyvault.enabled .Values.keyvault.secretProviderClass.create }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.keyvault.secretProviderClass.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axion.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.keyvault.secretProviderClass.provider | default "azure" }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ default .Values.global.azure.workloadIdentityClientId .Values.keyvault.secretProviderClass.clientID | quote }}
    keyvaultName: {{ default .Values.global.azure.keyvaultName .Values.keyvault.secretProviderClass.keyvaultName | quote }}
    tenantId: {{ default .Values.global.azure.tenantId .Values.keyvault.secretProviderClass.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: postgres-username
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: pgadmin-username
          objectType: secret
        - |
          objectName: pgadmin-password
          objectType: secret
  secretObjects:
    - secretName: axion-postgres-secret
      type: Opaque
      data:
        - objectName: postgres-username
          key: POSTGRES_USER
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
    - secretName: axion-pgadmin-secret
      type: Opaque
      data:
        - objectName: pgadmin-username
          key: PGADMIN_DEFAULT_EMAIL
        - objectName: pgadmin-password
          key: PGADMIN_DEFAULT_PASSWORD
{{- end }}
